<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Shared trade · Trade Journal</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#141a2e" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/share.css" />
  </head>
  <body>
    <main class="wrap shr">
      <p class="shr-brand">Trade <span>Journal</span> · shared trade</p>
      <div id="shr"><p class="hint">Loading…</p></div>
    </main>
    <div id="rvZoom" class="nomask" hidden>
      <div class="rvzbar">
        <button type="button" class="btn small ghost" data-z="prev" aria-label="Previous timeframe">‹</button
        ><span id="shzTf"></span
        ><button type="button" class="btn small ghost" data-z="next" aria-label="Next timeframe">›</button
        ><span class="shz-gap"></span
        ><button type="button" class="btn small" data-z="out" aria-label="Zoom out">−</button
        ><span id="rvzPct">100%</span><button type="button" class="btn small" data-z="in" aria-label="Zoom in">+</button
        ><button type="button" class="btn small ghost" data-z="reset">Fit</button
        ><button type="button" class="btn small" data-z="close" aria-label="Close">✕ Close</button>
      </div>
      <div class="rvzstage" id="rvzStage">
        <div class="rvzinner" id="rvzInner"><img alt="Chart" referrerpolicy="no-referrer" /></div>
      </div>
      <button type="button" class="shz-side l" data-z="prev" aria-label="Previous timeframe">‹</button>
      <button type="button" class="shz-side r" data-z="next" aria-label="Next timeframe">›</button>
      <p class="rvzhelp">Scroll or pinch to zoom · drag to move · ← → to switch timeframe · Esc to close</p>
    </div>
    <script src="supabase.js"></script>
    <script src="config.js"></script>
    <script src="js/share.js"></script>
  </body>
</html>
